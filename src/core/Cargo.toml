[package]
name = "sourmash"
version = "0.23.0"
authors = ["Luiz Irber <luiz@sourmash.bio>", "N. Tessa Pierce-Ward <tessa@sourmash.bio>", "C. Titus Brown <titus@idyll.org>"]
description = "tools for comparing biological sequences with k-mer sketches"
repository = "https://github.com/sourmash-bio/sourmash"
keywords = ["minhash", "bioinformatics"]
categories = ["science", "algorithms", "data-structures"]
license = "BSD-3-Clause"
edition = "2024"
readme = "README.md"
autoexamples = false
autobins = false
rust-version = "1.85.0"

[lib]
name = "sourmash"
crate-type = ["lib", "staticlib", "cdylib"]
bench = false

[features]
parallel = ["dep:rayon"]
maturin = []
branchwater = ["dep:rocksdb", "parallel"]
rkyv = ["dep:rkyv"]
default = []

[dependencies]
az = "1.0.0"
byteorder = "1.4.3"
camino = { version = "1.2.2", features = ["serde1"] }
cfg-if = "1.0"
counter = "0.6.0"
csv = "1.4.0"
dashmap = { version = "6.2.1", features = ["rayon"] }
enum_dispatch = "0.3.13"
fixedbitset = "0.4.0"
getset = "0.1.6"
histogram = "1.3.1"
itertools = "0.15.0"
log = "0.4.29"
md5 = "0.8.0"
memmap2 = "0.9.9"
murmurhash3 = "0.0.5"
needletail = { version = "0.7.3", default-features = false }
niffler = { version = "3.0.1", default-features = false, features = [ "gz", "zstd" ] }
nohash-hasher = "0.2.0"
num-iter = "0.1.45"
once_cell = "1.18.0"
ouroboros = "0.18.5"
piz = "0.5.0"
primal-check = "0.3.4"
rayon = { version = "1.12.0", optional = true }
replace_with = "0.1.8"
rkyv = { version = "0.8.15", optional = true }
roaring = "0.11.0"
roots = "0.0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
statrs = "0.18.0"
streaming-stats = "0.2.3"
thiserror = "2.0"
twox-hash = { version = "2", default-features = false, features = ["xxhash3_128", "std"] }
typed-builder = "0.22.0"  # 0.23 requires rust 1.88+
vec-collections = "0.4.3"

[dev-dependencies]
codspeed-criterion-compat = "4.6.0"
proptest = { version = "1.11.0", default-features = false, features = ["std"]}
rand = "0.10.1"
tempfile = "3.27.0"

[[bench]]
name = "compute"
harness = false

[[bench]]
name = "nodegraph"
harness = false

[[bench]]
name = "minhash"
harness = false

[[bench]]
name = "gather"
harness = false

[package.metadata.cargo-feature-combinations]
skip_optional_dependencies = true
denylist = ["maturin"]
skip_feature_sets = [
    ["branchwater", "parallel"], # branchwater implies parallel
]

## Wasm section. Crates only used for WASM, as well as specific configurations

[target.'cfg(all(target_arch = "wasm32", target_os="unknown"))'.dependencies]
js-sys = "0.3.72"
web-sys = { version = "0.3.72", features = ["console", "File", "FileReaderSync"] }
wasm-bindgen = "0.2.89"
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(all(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.32", features = ["wasmbind"] }

[target.'cfg(all(target_arch = "wasm32", target_os="unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3.67"

### These crates don't compile on wasm
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rocksdb]
version = "0.24.0"
optional = true
default-features = false
features = [ "bindgen-runtime", "snappy", "zstd" ]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8.2"
